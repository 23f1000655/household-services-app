<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Customer</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Itim&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Rubik+Moonrocks&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #fec7c4;
            color: #20120C;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }
        .register-container {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .text-center {
            margin-bottom: 20px;
        }
        #register-btn {
            width: 100%;
        }
        .form-group {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="text-center mb-4">
            <h1 class="display-4" style="font-family: 'Rubik Moonrocks', cursive;">Veenus</h1>
            <p style="font-family: 'Itim'; font-size: 1.5rem;">REGISTER AS CUSTOMER</p>
        </div>
        <form id="register-form" action="/cust_register" method="POST">
            <div class="form-floating mb-3" style="font-family: 'IBM Plex Serif';">
                <input type="text" class="form-control" id="floatingFullName" name="full_name" placeholder="Full Name" required>
            </div>
            
            <div class="form-floating mb-3" style="font-family: 'IBM Plex Serif';">
                <input type="text" class="form-control" id="floatingUsername" name="username" placeholder="Username" required>
            </div>
            
            <div class="form-floating mb-3" style="font-family: 'IBM Plex Serif';">
                <input type="password" class="form-control" id="floatingPassword" name="password" placeholder="Password" required>
            </div>
            
            <div class="form-floating mb-3" style="font-family: 'IBM Plex Serif';">
                <input type="number" class="form-control" id="floatingPhoneNumber" name="phone_number" placeholder="Phone Number" pattern="\d*" maxlength="10" required>    
            </div>
            
            <div class="form-floating mb-3" style="font-family: 'IBM Plex Serif';">
                <textarea class="form-control" id="floatingAddress" name="address" placeholder="Address" style="height: 100px;" required></textarea>
            </div>
            
            <div class="form-floating mb-3" style="font-family: 'IBM Plex Serif';">
                <input type="number" class="form-control" id="floatingPincode" name="pincode" placeholder="Pincode" required>
            </div>
            
            <button type="submit" id="register-btn" class="btn btn-primary" style="font-family: 'IBM Plex Serif'; width: 100%; background-color: #3b189b;">Register</button>
        </form>
        <div class="mt-3">
            <a href="/login">Already have an account? Login</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
