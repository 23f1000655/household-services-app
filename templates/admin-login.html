<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Itim&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Rubik+Moonrocks&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #fec7c4;
            color: #20120C;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }
        
        .login-container {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .text-center {
            margin-bottom: 20px;
        }
        #login-btn, .register-btn {
            width: 100%;
            margin-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="text-center mb-4">
            <h1 class="display-4" style="font-family: 'Rubik Moonrocks', cursive;">Veenus</h1>
            <p style="font-family: 'Itim'; font-size: 1.5rem;">ADMIN LOGIN</p>
        </div>
        <form id="login-form" action="/admin-login" method="POST">
            <div class="form-floating mb-3" style="font-family: 'IBM Plex Serif';">
                <input type="text" class="form-control" id="floatingInput" placeholder="Username" name ="username" required>
            </div>
            <div class="form-floating" style="font-family: 'IBM Plex Serif';">
                <input type="password" class="form-control" id="floatingPassword" placeholder="Password" name="password" required>
            </div>
            <br>
            <button type="submit" id="login-btn" class="btn btn-primary" style="background-color: #3b189b; font-family: 'IBM Plex Serif';">Login</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
