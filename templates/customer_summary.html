<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEENUS - Customer Dashboard</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Itim&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Rubik+Moonrocks&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Rubik Moonrocks', sans-serif;
            background-color: #fec7c4;
        }
        
        .container {
            background-color: white;
            margin: 20px;
            padding: 20px;
            border-radius: 50px;
            box-shadow: 0 20px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 1550px;
            justify-content: center;
            align-items: center;
        }

        .banner {
            background-color: #20120c;
            color: #fec7c4;
            text-align: center;
            padding: 20px;
        }

        .banner h1 {
            font-family: 'Rubik Moonrocks', cursive;
            font-size: 4em;
            margin: 0;
        }

        .banner h2 {
            font-family: 'Itim', cursive;
            font-size: 1.5em;
            margin: 10px 0;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .nav-buttons a {
            text-decoration: none;
            font-family: 'IBM Plex Serif', serif;
            background-color: #3b189b;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            transition: transform 0.3s, background-color 0.3s;
        }

        .nav-buttons a:hover {
            transform: scale(1.1);
            background-color: #5c3bca;
        }
        
        .banner hr {
            width: 40%;
            margin: 10px auto;
            border: 0;
            border-top: 2px solid #fec7c4;
        }

        .charts-container {
            display: flex;
            justify-content: space-evenly;
            align-items: flex-start;
            margin-top: 20px;
        }
        .chart {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            background-color: #fec7c4;
            width: 45%;
            text-align: center;
        }
        .chart img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="banner">
        <h1>Veenus</h1>
        <h2>Customer Dashboard</h2>
        <hr>

        <div class="nav-buttons">
            <a href="{{ url_for('customer_dashboard', username=customer.username) }}"><strong>Home</strong></a>
            <a href="{{ url_for('customer_search', username=customer.username) }}"><strong>Search</strong></a>
            <a href="{{ url_for('customer_summary', username=customer.username) }}"><strong>Summary</strong></a>
            <a href="/"><strong>Logout</strong></a>
        </div>
    </div>
    <div style="font-family: 'IBM Plex Serif', serif;">
        <br>
        <h3 style="text-align: center;">Service Requests Summary</h3>
        <hr>
        <div class="charts-container center-chart">
            <img src="{{ requests_chart }}" alt="Requests Chart">
        </div>
    </div>
</body>
</html>
