<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Service</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Itim&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Rubik+Moonrocks&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'IBM Plex Serif', serif;
            background-color: #fec7c4;
        }

        .login-container {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            margin: auto;
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .btn-custom {
            background-color: #3b189b;
            color: white;
            font-family: 'IBM Plex Serif', serif;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn-custom:hover {
            background-color: #5c3bca;
            transform: scale(1.05);
            color: white;
        }
        .banner {
            background-color: #20120c;
            color: #fec7c4;
            text-align: center;
            padding: 20px;
        }

        .banner h1 {
            font-family: 'Rubik Moonrocks', cursive;
            font-size: 4em;
            margin: 0;
        }

        .banner h2 {
            font-family: 'Itim', cursive;
            font-size: 1.5em;
            margin: 10px 0;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .nav-buttons a {
            text-decoration: none;
            font-family: 'IBM Plex Serif', serif;
            background-color: #3b189b;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            transition: transform 0.3s, background-color 0.3s;
        }

        .nav-buttons a:hover {
            transform: scale(1.1);
            background-color: #5c3bca;
        }
        
        .banner hr {
            width: 40%;
            margin: 10px auto;
            border: 0;
            border-top: 2px solid #fec7c4;
        }
    </style>
</head>
<body>
    <div class="banner">
        <h1>Veenus</h1>
        <h2>Admin Dashboard</h2>
        <hr>

        <div class="nav-buttons">
            <a href="/admin_dashboard"><strong>Home</strong></a>
            <a href="/admin_search"><strong>Search</strong></a>
            <a href="/admin_summary"><strong>Summary</strong></a>
            <a href="/"><strong>Logout</strong></a>
        </div>
    </div>
    <div class="login-container">
        <h2 class="text-center">Add New Service</h2>
        <hr>
        <form action="{{ url_for('new_service') }}" method="POST">
            <div class="form-group">
                <label for="service_name">Service Name:</label>
                <input type="text" class="form-control" id="service_name" name="service_name" required>
            </div>
            <div class="form-group">
                <label for="base_price">Base Price:</label>
                <input type="number" step="1" class="form-control" id="base_price" name="base_price">
            </div>
            <button type="submit" class="btn btn-custom btn-block">Add</button>
        </form>
    </div>
</body>
</html>
